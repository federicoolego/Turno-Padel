<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turno de Pádel - Confirmado ✅</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎾</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ===== TEMA OSCURO (default) ===== */
    :root {
      --bg: #060d1a;
      --form-bg: #0a0f1e;
      --form-border: #1a2e4a;
      --header-title: #f0c040;
      --header-sub: #4a7aaa;
      --label: #7ab3e0;
      --label-opt: #3d6080;
      --input-bg: #0d1f3c;
      --input-border: #1e3a5f;
      --input-text: #e8f4ff;
      --input-focus: #4fc3f7;
      --divider: #1a2e4a;
      --btn-bg: #001f5b;
      --btn-border: #4fc3f7;
      --btn-text: #ffffff;
      --btn-hover: #0a3060;
      --hint: #3d6080;
      --credit: #2a4a6a;
      --card-bg: #001f5b;
      --card-border: #1e3a5f;
      --card-header-bg: #000d2e;
      --card-header-accent: #f0c040;
      --card-header-title: #ffffff;
      --card-confirmed: #ffffff;
      --card-row-border: #0d2a4a;
      --card-key: #4a7aaa;
      --card-val: #ffffff;
      --badge-bg: #f0c040;
      --badge-text: #000d2e;
      --players-bg: #00174a;
      --players-border: #0d2a4a;
      --players-label: #4a7aaa;
      --chip-bg: #0a3060;
      --chip-border: #1e3a5f;
      --chip-text: #e8f4ff;
      --chip-empty-text: #4a7aaa;
      --footer-bg: #000a22;
      --footer-text: #e8f4ff;
      --footer-credit: #4a7aaa;
      --screenshot-hint: #3d6080;
      --copy-bg: #0d2a4a;
      --copy-border: #1e3a5f;
      --copy-text: #7ab3e0;
      --copy-hover: #0f3460;
      --toast: #4caf8c;
      --reset-border: #1e3a5f;
      --reset-text: #4a7aaa;
      --theme-btn-bg: #0d1f3c;
      --theme-btn-border: #1e3a5f;
    }

    /* ===== TEMA CLARO ===== */
    [data-theme="light"] {
      --bg: #eef3f9;
      --form-bg: #ffffff;
      --form-border: #d4e0ee;
      --header-title: #c8951a;
      --header-sub: #5f86ad;
      --label: #2e6da4;
      --label-opt: #93a8bd;
      --input-bg: #f4f8fc;
      --input-border: #c9d8e8;
      --input-text: #1a2e44;
      --input-focus: #2e86c1;
      --divider: #e1e9f2;
      --btn-bg: #1565c0;
      --btn-border: #1565c0;
      --btn-text: #ffffff;
      --btn-hover: #0d4d96;
      --hint: #93a8bd;
      --credit: #aab9c9;
      --card-bg: #ffffff;
      --card-border: #d4e0ee;
      --card-header-bg: #1565c0;
      --card-header-accent: #f0c040;
      --card-header-title: #ffffff;
      --card-confirmed: #ffffff;
      --card-row-border: #e1e9f2;
      --card-key: #5f86ad;
      --card-val: #14304a;
      --badge-bg: #f0c040;
      --badge-text: #0d3f78;
      --players-bg: #f4f8fc;
      --players-border: #e1e9f2;
      --players-label: #5f86ad;
      --chip-bg: #e6eef7;
      --chip-border: #c9d8e8;
      --chip-text: #14304a;
      --chip-empty-text: #5f86ad;
      --footer-bg: #f4f8fc;
      --footer-text: #1565c0;
      --footer-credit: #5f86ad;
      --screenshot-hint: #93a8bd;
      --copy-bg: #f4f8fc;
      --copy-border: #c9d8e8;
      --copy-text: #2e6da4;
      --copy-hover: #e6eef7;
      --toast: #2e9c78;
      --reset-border: #c9d8e8;
      --reset-text: #5f86ad;
      --theme-btn-bg: #ffffff;
      --theme-btn-border: #c9d8e8;
    }

    body {
      background: var(--bg);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 16px 48px;
      transition: background 0.3s;
    }

    .container { width: 100%; max-width: 440px; position: relative; }

    /* Botón de cambio de tema */
    .theme-toggle {
      position: absolute;
      top: -8px;
      right: 0;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--theme-btn-bg);
      border: 1px solid var(--theme-btn-border);
      color: var(--header-title);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, border-color 0.2s, background 0.3s;
      z-index: 10;
      line-height: 1;
    }

    .theme-toggle:hover { border-color: var(--input-focus); transform: scale(1.08); }
    .theme-toggle:active { transform: scale(0.95); }

    .form-card {
      background: var(--form-bg);
      border: 1px solid var(--form-border);
      border-radius: 20px;
      padding: 28px 24px;
      margin-bottom: 24px;
      transition: background 0.3s, border-color 0.3s;
    }

    .form-header { text-align: center; margin-bottom: 24px; }
    .form-header .ball { font-size: 40px; display: block; margin-bottom: 8px; }

    .form-header h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--header-title);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .form-header p {
      color: var(--header-sub);
      font-size: 12px;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      color: var(--label);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }

    .field label .opt {
      color: var(--label-opt);
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      font-size: 11px;
    }

    .field label .req {
      color: #ff4444;
      font-weight: 700;
      font-size: 13px;
      margin-left: 3px;
      vertical-align: middle;
      line-height: 1;
    }

    input[type="date"],
    input[type="time"],
    input[type="text"],
    select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--input-text);
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      padding: 11px 14px;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, background 0.3s, color 0.3s;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="date"]:focus,
    input[type="time"]:focus,
    input[type="text"]:focus,
    select:focus { border-color: var(--input-focus); }

    select:disabled { opacity: 0.45; cursor: not-allowed; }
    select option { background: var(--input-bg); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .divider {
      border: none;
      border-top: 1px solid var(--divider);
      margin: 20px 0;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--btn-bg);
      border: 2px solid var(--btn-border);
      color: var(--btn-text);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    .btn:hover { background: var(--btn-hover); }
    .btn:active { transform: scale(0.98); }

    .hint {
      text-align: center;
      color: var(--hint);
      font-size: 11px;
      margin-top: 10px;
      line-height: 1.5;
    }

    .credit {
      text-align: center;
      color: var(--credit);
      font-size: 11px;
      margin-top: 16px;
      letter-spacing: 0.5px;
      font-style: italic;
    }

    /* TARJETA */
    .card-wrap { display: none; }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      border: 2px solid var(--card-border);
      overflow: hidden;
      transition: background 0.3s, border-color 0.3s;
    }

    .card-header {
      background: var(--card-header-bg);
      padding: 24px 24px 20px;
      border-bottom: 3px solid var(--card-header-accent);
      text-align: center;
    }

    .card-header-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .card-header .emoji { font-size: 40px; line-height: 1; }

    .card-header h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--card-header-title);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin: 0;
    }

    .card-header .confirmed {
      color: var(--card-confirmed);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-top: 10px;
    }

    .card-body { padding: 6px 0; }

    .card-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 24px;
      border-bottom: 1px solid var(--card-row-border);
    }

    .card-row:last-child { border-bottom: none; }

    .card-row .icon { font-size: 22px; min-width: 30px; text-align: center; }

    .card-row .key {
      color: var(--card-key);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      line-height: 1;
      margin-bottom: 3px;
    }

    .card-row .val {
      color: var(--card-val);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1;
    }

    .badge-hoy {
      display: inline-block;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 2px 7px;
      border-radius: 6px;
      margin-left: 8px;
      vertical-align: middle;
      position: relative;
      top: -1px;
    }

    .card-players {
      background: var(--players-bg);
      padding: 16px 24px;
      border-top: 2px solid var(--players-border);
    }

    .card-players .players-label {
      color: var(--players-label);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .player-list { display: flex; flex-wrap: wrap; gap: 8px; }

    .player-chip {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      color: var(--chip-text);
      font-size: 14px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 20px;
    }

    .player-chip-empty {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      color: var(--chip-empty-text);
      font-size: 18px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
    }

    .card-footer {
      background: var(--footer-bg);
      padding: 15px 24px;
      text-align: center;
      border-top: 1px solid var(--card-row-border);
    }

    .card-footer p {
      color: var(--footer-text);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      font-style: italic;
    }

    .screenshot-hint {
      text-align: center;
      color: var(--screenshot-hint);
      font-size: 11px;
      margin-top: 14px;
      line-height: 1.6;
    }

    .share-btns { display: flex; gap: 10px; margin-top: 14px; }

    .share-btn {
      flex: 1;
      padding: 11px 10px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .share-btn:active { transform: scale(0.97); }

    .btn-copy {
      background: var(--copy-bg);
      border: 1px solid var(--copy-border);
      color: var(--copy-text);
    }

    .btn-copy:hover { background: var(--copy-hover); }

    .btn-wa { background: #1da851; color: #ffffff; }
    .btn-wa:hover { opacity: 0.88; }

    .toast {
      display: none;
      text-align: center;
      color: var(--toast);
      font-size: 12px;
      margin-top: 8px;
      font-weight: 500;
    }

    .reset-btn {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--reset-border);
      color: var(--reset-text);
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .reset-btn:hover { border-color: var(--input-focus); color: var(--label); }

    @media (max-width: 480px) {
      body { padding: 16px 12px 40px; }
      .form-card { padding: 22px 18px; }
      .theme-toggle { top: -4px; width: 38px; height: 38px; font-size: 18px; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Botón de cambio de tema -->
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Cambiar tema">🌙</button>

  <div class="form-card" id="formCard">
    <div class="form-header">
      <h1>🎾 Turno de Pádel</h1>
      <p>Completá los datos y generá tu tarjeta</p>
    </div>

    <div class="grid-2">
      <div class="field">
        <label>📅 Fecha <span class="req">*</span></label>
        <input type="date" id="fecha">
      </div>
      <div class="field">
        <label>⏰ Hora <span class="req">*</span></label>
        <input type="time" id="hora">
      </div>
    </div>

    <div class="field">
      <label>📍 Lugar <span class="req">*</span></label>
      <input type="text" id="lugar" placeholder="Lugar">
    </div>

    <div class="field">
      <label>🏟️ Cancha <span class="opt">(opcional)</span></label>
      <input type="text" id="cancha" placeholder="Cancha">
    </div>

    <div class="field">
      <label>👥 Jugadores <span class="opt">(opcional)</span></label>
      <div class="grid-2" style="gap: 10px;">
        <input type="text" id="jugador1" placeholder="Jugador 1">
        <input type="text" id="jugador2" placeholder="Jugador 2">
        <input type="text" id="jugador3" placeholder="Jugador 3">
        <input type="text" id="jugador4" placeholder="Jugador 4">
      </div>
    </div>

    <hr class="divider">

    <button class="btn" onclick="generarTarjeta()">🎾 Generar tarjeta</button>
    <p class="hint">Completá los datos para compartir por WhatsApp</p>
    <p class="credit">Desarrollado por Federico Olego</p>
  </div>

  <div class="card-wrap" id="cardWrap">
    <div class="card" id="card">
      <div class="card-header">
        <div class="card-header-title">
          <h2>Turno de Padel</h2>
        </div>
        <p class="confirmed">✅ Confirmado ✅</p>
      </div>
      <div class="card-body" id="cardBody"></div>
      <div class="card-players" id="cardPlayers"></div>
      <div class="card-footer" id="cardFooter"></div>
    </div>
    <p class="screenshot-hint">☝️ Compartí la tarjeta por WhatsApp o copiá la imagen</p>
    <div class="share-btns">
      <button class="share-btn btn-copy" onclick="copiarImagen()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copiar imagen
      </button>
      <button class="share-btn btn-wa" onclick="compartirWhatsApp()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
        WhatsApp
      </button>
    </div>
    <div class="toast" id="toast">✅ ¡Imagen copiada! Pegala en WhatsApp</div>
    <button class="reset-btn" onclick="resetForm()">← Modificar datos</button>
  </div>

</div>

<script>
  // ===== Cambio de tema =====
  function toggleTheme() {
    const html = document.documentElement;
    const btn = document.getElementById('themeToggle');
    const isLight = html.getAttribute('data-theme') === 'light';
    if (isLight) {
      html.removeAttribute('data-theme'); // vuelve a oscuro
      btn.textContent = '🌙';
    } else {
      html.setAttribute('data-theme', 'light');
      btn.textContent = '☀️';
    }
  }

  const FRASES = [
    '¡Nos vemos en la cancha! 💪',
    /*'¡Hoy ganamos todos! 🏆',
    '¡A romperla en cancha! 🔥',
    '¡Dale que los pisamos! 🎾'}*/
  ];

  function getTodayString() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function getTomorrowString() {
    const now = new Date();
    now.setDate(now.getDate() + 1);
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function formatFecha(val) {
    if (!val) return '';
    const [y, m, d] = val.split('-');
    const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
    const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const date = new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
    return `${DIAS[date.getDay()]} ${parseInt(d)} de ${MESES[parseInt(m) - 1]}`;
  }

  function generarTarjeta() {
    const fecha  = document.getElementById('fecha').value;
    const hora   = document.getElementById('hora').value;
    const lugar  = document.getElementById('lugar').value.trim();
    const cancha = document.getElementById('cancha').value.trim();

    const players = [1,2,3,4]
      .map(i => document.getElementById('jugador' + i).value.trim())
      .filter(Boolean);

    if (!fecha || !hora || !lugar) {
      alert('⚠️ Completá fecha, hora y lugar para continuar.');
      return;
    }

    const esHoy = fecha === getTodayString();
    const esManiana = fecha === getTomorrowString();
    const fechaFormateada = formatFecha(fecha);
    let fechaVal = fechaFormateada;
    if (esHoy)     fechaVal += ` <span class="badge-hoy">HOY</span>`;
    if (esManiana) fechaVal += ` <span class="badge-hoy">MAÑANA</span>`;

    const rows = [
      { icon: '📅', key: 'Fecha',  val: fechaVal },
      { icon: '⏰', key: 'Hora',   val: hora + 'hs' },
      { icon: '📍', key: 'Lugar',  val: lugar || '-' },
      { icon: '🏟️', key: 'Cancha', val: cancha || '-' },
    ];

    document.getElementById('cardBody').innerHTML = rows.map(r => `
      <div class="card-row">
        <span class="icon">${r.icon}</span>
        <div>
          <div class="key">${r.key}</div>
          <div class="val">${r.val}</div>
        </div>
      </div>
    `).join('');

    if (players.length > 0) {
      const playersHTML = players.map(p => `<span class="player-chip">${p}</span>`).join('');
      document.getElementById('cardPlayers').innerHTML = `
        <div class="players-label">👥 Jugadores</div>
        <div class="player-list">${playersHTML}</div>
      `;
      document.getElementById('cardPlayers').style.display = '';
    } else {
      document.getElementById('cardPlayers').innerHTML = '';
      document.getElementById('cardPlayers').style.display = 'none';
    }

    const frase = FRASES[Math.floor(Math.random() * FRASES.length)];
    document.getElementById('cardFooter').innerHTML = `
      <p>${frase}</p>
      <p style="font-size:11px; color:var(--footer-credit); margin-top:8px; font-style:italic; font-weight:400; letter-spacing:0.5px;">Desarrollado por Federico Olego</p>
    `;

    document.getElementById('formCard').style.display = 'none';
    const wrap = document.getElementById('cardWrap');
    wrap.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    document.getElementById('cardWrap').style.display = 'none';
    document.getElementById('formCard').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function capturarCanvas() {
    const card = document.getElementById('card');
    const tema = document.documentElement.getAttribute('data-theme'); // 'light' o null
    return await html2canvas(card, {
      backgroundColor: null,
      scale: 2,
      useCORS: true,
      onclone: (clonedDoc) => {
        // Asegura que el documento clonado conserve el tema activo,
        // así las variables CSS resuelven igual que en pantalla.
        if (tema === 'light') {
          clonedDoc.documentElement.setAttribute('data-theme', 'light');
        } else {
          clonedDoc.documentElement.removeAttribute('data-theme');
        }
      }
    });
  }

  async function copiarImagen() {
    try {
      const canvas = await capturarCanvas();
      canvas.toBlob(async blob => {
        try {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          const toast = document.getElementById('toast');
          toast.style.display = 'block';
          setTimeout(() => toast.style.display = 'none', 3000);
        } catch {
          const url = canvas.toDataURL();
          const a = document.createElement('a');
          a.href = url; a.download = 'turno-padel.png'; a.click();
        }
      });
    } catch(e) {
      alert('No se pudo copiar. Hacé screenshot manualmente.');
    }
  }

  async function compartirWhatsApp() {
    try {
      const canvas = await capturarCanvas();
      canvas.toBlob(async blob => {
        const file = new File([blob], 'turno-padel.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Turno de Pádel' });
        } else {
          const url = canvas.toDataURL();
          const a = document.createElement('a');
          a.href = url; a.download = 'turno-padel.png'; a.click();
        }
      });
    } catch(e) {
      alert('No se pudo compartir. Descargá la imagen y mandala por WhatsApp.');
    }
  }

  const today = getTodayString();
  const fechaInput = document.getElementById('fecha');
  fechaInput.value = today;
  fechaInput.min = today;
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
